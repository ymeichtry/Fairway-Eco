# Production Configuration for Gateway
# Override with actual production values via environment variables
# CORS Configuration - MUST be set via environment variables in production
# Example: CORS_ALLOWED_ORIGINS=https://app.example.com,https://www.example.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-frontend-domain.com}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
# Backend Service URL - typically internal service name in production
backend.service.url=${BACKEND_SERVICE_URL:http://backend:8080}
# Logging - reduce verbosity in production
logging.level.org.springframework.cloud.gateway=INFO
logging.level.bbw.ch.gateway=INFO
